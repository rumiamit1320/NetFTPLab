name: Debug Source
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print MainActivity region
        run: |
          echo '--- SOURCE LINES 48-64 ---'
          nl -ba app/src/main/java/com/netftplab/MainActivity.kt | sed -n '48,64p'

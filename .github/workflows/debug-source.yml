name: One-time MainActivity Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate TransfersTab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/netftplab/MainActivity.kt')
          s=p.read_text()
          marker=' @Composable private fun TransfersTab()'
          a=s.find(marker)
          b=s.find(marker,a+len(marker))
          if a < 0 or b < 0:
              raise SystemExit('Expected two TransfersTab declarations')
          s=s[:a]+s[b:]
          p.write_text(s)
          PY
      - name: Commit repair and remove workflow
        run: |
          rm -f .github/workflows/debug-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt .github/workflows/debug-source.yml
          git commit -m 'Remove duplicate TransfersTab and restore class scope'
          git push

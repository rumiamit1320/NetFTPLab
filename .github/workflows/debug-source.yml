name: Repair MainActivity
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Kotlin syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/netftplab/MainActivity.kt')
          s=p.read_text()
          s2=s.replace('awaitAll()};withContext(Dispatchers.Main)', 'awaitAll();withContext(Dispatchers.Main)')
          s2=s2.replace('onClick={{ saveServerFileToPhone(f) }}', 'onClick={ { saveServerFileToPhone(f) } }')
          s2=s2.replace('onClick={{ deleteServerFile(f) }}', 'onClick={ { deleteServerFile(f) } }')
          if s2==s:
              print('No repair patterns found; nothing to commit.')
          else:
              p.write_text(s2)
              print('Applied MainActivity syntax repairs.')
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt
          git commit -m 'Fix MainActivity coroutine and callback syntax'
          git push

name: Fix transfer UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kotlin callbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/netftplab/MainActivity.kt')
          s = p.read_text()
          s = s.replace('::saveServerFileToPhone.bind(f)', '{ saveServerFileToPhone(f) }')
          s = s.replace('::deleteServerFile.bind(f)', '{ deleteServerFile(f) }')
          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt
          git rm .github/workflows/fix-transfer-ui.yml
          git commit -m 'Fix server file action callbacks'
          git push
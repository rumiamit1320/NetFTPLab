name: Fix parseListing syntax

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Kotlin declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/netftplab/MainActivity.kt')
          s = p.read_text()
          old = 'private fun parseListing(text:String):List<RemoteEntry>='
          new = 'private fun parseListing(text:String):List<RemoteEntry> ='
          if old not in s:
              raise SystemExit('Expected parseListing declaration was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt
          git rm .github/workflows/fix_parse_listing.yml
          git commit -m 'Fix parseListing Kotlin syntax'
          git push

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply storage and notification fixes
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/netftplab/MainActivity.kt')
          s=p.read_text()
          marker='''    private val shareDocument = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n        if (uri != null) importToServer(uri)\n    }\n'''
          if marker in s and 'notificationPermissionLauncher' not in s:
              s=s.replace(marker, marker+'''\n    private val notificationPermissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->\n        if (granted && serverRunning) showServerNotification()\n        else if (!granted) log("SERVER", "Notification permission denied; FTP server remains available in-app")\n    }\n''',1)
          old='''        if (android.os.Build.VERSION.SDK_INT >= 33) {\n            requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 40)\n        }'''
          new='''        if (android.os.Build.VERSION.SDK_INT >= 33 &&\n            checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {\n            notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n        }'''
          if old in s: s=s.replace(old,new,1)
          start=s.find('    private fun download(entry: RemoteEntry) {'); end=s.find('    private fun verifyRemote(',start)
          if start<0 or end<0: raise SystemExit('download markers not found')
          download=r'''    private fun download(entry: RemoteEntry) {
        val client=ftp ?: return
        if(entry.directory)return
        lifecycleScope.launch(Dispatchers.IO){
            try{
                val outFile=File(transferRoot,entry.name).canonicalFile
                if(!outFile.path.startsWith(transferRoot.canonicalPath+File.separator))throw IOException("Unsafe filename")
                val total=client.remoteSize(entry.name).takeIf{it>=0}?:entry.size
                val existing=if(outFile.exists())outFile.length() else 0L
                if(total>0&&existing>=total){
                    val localHash=sha256(outFile); val remoteHash=client.remoteSha256(entry.name)
                    val verified=remoteHash.takeIf{it.isNotBlank()}?.let{localHash.equals(it,true)}
                    transfer=TransferState(false,"DOWNLOAD",entry.name,total,total,0,"Already complete",localHash,remoteHash,verified)
                    publishToDownloads(outFile,entry.name)
                    log("DATA","Download cache already complete; published ${entry.name} to Downloads")
                    return@launch
                }
                val resume=if(existing>0)min(existing,total) else 0L
                val started=System.currentTimeMillis()
                transfer=TransferState(true,"DOWNLOAD",entry.name,resume,total,0,if(resume>0)"Resuming" else "Starting")
                RandomAccessFile(outFile,"rw").use{raf->
                    raf.setLength(resume);raf.seek(resume)
                    val output=object:OutputStream(){override fun write(b:Int)=raf.write(b);override fun write(b:ByteArray,off:Int,len:Int)=raf.write(b,off,len)}
                    client.download(entry.name,output,resume){done,receivedTotal->
                        val elapsed=maxOf(1L,System.currentTimeMillis()-started)
                        transfer=transfer.copy(done=done,total=receivedTotal,speedBps=done*1000L/elapsed,message="Transferring")
                    }
                    output.flush()
                }
                val localHash=sha256(outFile);val remoteHash=client.remoteSha256(entry.name)
                val verified=remoteHash.takeIf{it.isNotBlank()}?.let{localHash.equals(it,true)}
                if(verified==false)throw IOException("SHA-256 verification failed")
                publishToDownloads(outFile,entry.name)
                transfer=transfer.copy(active=false,message="Complete — saved to Downloads",sha256Local=localHash,sha256Remote=remoteHash,verified=verified)
                session=session.copy(bytes=session.bytes+outFile.length())
                log("DATA","Saved ${entry.name} to public Downloads; SHA-256 $localHash")
            }catch(e:Exception){
                transfer=transfer.copy(active=false,message="Download failed: ${e.message}")
                log("ERROR","Download failed: ${e.message}")
            }
        }
    }

    private fun publishToDownloads(source:File,displayName:String){
        if(android.os.Build.VERSION.SDK_INT>=29){
            val resolver=contentResolver
            val values=ContentValues().apply{put(MediaStore.Downloads.DISPLAY_NAME,displayName);put(MediaStore.Downloads.MIME_TYPE,mimeTypeFor(displayName));put(MediaStore.Downloads.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS);put(MediaStore.Downloads.IS_PENDING,1)}
            val uri=resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,values)?:throw IOException("Cannot create public Downloads entry")
            try{resolver.openOutputStream(uri)?.use{output->source.inputStream().use{input->input.copyTo(output,64*1024)}}?:throw IOException("Cannot open public Downloads output");values.clear();values.put(MediaStore.Downloads.IS_PENDING,0);resolver.update(uri,values,null,null)}catch(e:Exception){resolver.delete(uri,null,null);throw e}
        }else{
            @Suppress("DEPRECATION") val dir=Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS).apply{mkdirs()}
            val destination=File(dir,displayName).canonicalFile
            if(!destination.path.startsWith(dir.canonicalPath+File.separator))throw IOException("Unsafe Downloads filename")
            source.inputStream().use{input->destination.outputStream().use{output->input.copyTo(output,64*1024)}}
        }
        transfer=transfer.copy(message="Saved to Downloads")
    }

    private fun mimeTypeFor(name:String):String=when(name.substringAfterLast('.',"").lowercase(Locale.US)){"pdf"->"application/pdf";"txt","log"->"text/plain";"csv"->"text/csv";"json"->"application/json";"xml"->"application/xml";"jpg","jpeg"->"image/jpeg";"png"->"image/png";"gif"->"image/gif";"mp3"->"audio/mpeg";"mp4"->"video/mp4";"xlsx"->"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";"docx"->"application/vnd.openxmlformats-officedocument.wordprocessingml.document";"pptx"->"application/vnd.openxmlformats-officedocument.presentationml.presentation";"zip"->"application/zip";else->"application/octet-stream"}

'''
          s=s[:start]+download+s[end:]
          s=s.replace('Local transfer directory: ${transferRoot.absolutePath}','Download destination: public Downloads')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt
          git commit -m 'Apply public Downloads and notification fixes' || true
          git push origin HEAD:main || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFTPLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

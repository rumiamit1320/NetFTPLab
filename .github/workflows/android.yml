name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply transfer UI fix
        run: python3 tools/apply_transfer_ui_fix.py

      - name: Apply Server UI fix
        run: python3 tools/apply_server_ui_fix.py

      - name: Apply Advanced Monitor UI fix
        run: python3 tools/apply_advanced_monitor.py

      - name: Apply device name UI fix
        run: python3 tools/apply_device_name.py

      - name: Apply multi-file transfer fix
        run: python3 tools/apply_multi_file_transfer.py

      - name: Serialize FTP operations
        run: python3 tools/apply_ftp_transfer_serialization.py

      - name: Commit patched source
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt app/src/main/java/com/netftplab/AdvancedNetworkMonitor.kt tools/apply_advanced_monitor.py tools/apply_device_name.py tools/apply_multi_file_transfer.py tools/apply_ftp_transfer_serialization.py
          git diff --cached --quiet || git commit -m 'Serialize FTP operations during multi-file transfer'
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFTPLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: netftplab-main-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply transfer UI fix
        run: python3 tools/apply_transfer_ui_fix.py

      - name: Apply Server UI fix
        run: python3 tools/apply_server_ui_fix.py

      - name: Apply Advanced Monitor UI fix
        run: python3 tools/apply_advanced_monitor.py

      - name: Apply device name UI fix
        run: python3 tools/apply_device_name.py

      - name: Apply multi-file transfer fix
        run: python3 tools/apply_multi_file_transfer.py

      - name: Prepare transfer reliability patch
        run: python3 tools/prepare_transfer_reliability.py

      - name: Apply transfer reliability fix
        run: python3 tools/apply_transfer_reliability.py

      - name: Clean transfer reliability source
        run: python3 tools/cleanup_transfer_reliability.py

      - name: Apply transfer operation helpers
        run: python3 tools/apply_transfer_helpers.py

      - name: Apply live telemetry fix
        run: python3 tools/apply_live_telemetry.py

      - name: Apply server and monitor visual fix
        run: python3 tools/apply_monitor_server_visual_fix.py

      - name: Apply single-item download option
        run: python3 tools/apply_single_download_option.py

      - name: Serialize FTP operations
        run: python3 tools/apply_ftp_transfer_serialization.py

      - name: Apply final monitor and transfer correction
        run: python3 tools/apply_final_monitor_transfer_fix.py

      - name: Restore working monitor and preserve transfer/device UI
        run: python3 tools/apply_ui_preservation_fix.py

      - name: Fix real-time throughput metric
        run: python3 tools/apply_throughput_metric_fix.py

      - name: Apply server storage management
        run: python3 tools/apply_server_storage_v2.py

      - name: Commit patched source
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/netftplab/MainActivity.kt app/src/main/java/com/netftplab/FtpClient.kt app/src/main/java/com/netftplab/AdvancedNetworkMonitor.kt app/src/main/AndroidManifest.xml app/src/main/res/xml/file_paths.xml tools/apply_advanced_monitor.py tools/apply_device_name.py tools/apply_multi_file_transfer.py tools/prepare_transfer_reliability.py tools/apply_transfer_reliability.py tools/cleanup_transfer_reliability.py tools/apply_transfer_helpers.py tools/apply_live_telemetry.py tools/apply_monitor_server_visual_fix.py tools/apply_single_download_option.py tools/apply_monitor_transfer_telemetry_fix.py tools/apply_ftp_transfer_serialization.py tools/apply_final_monitor_transfer_fix.py tools/apply_ui_preservation_fix.py tools/apply_throughput_metric_fix.py tools/apply_server_storage_management.py tools/apply_server_storage_v2.py
          git diff --cached --quiet || git commit -m 'Fix real-time throughput metric'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict while synchronizing main; refusing to overwrite remote history.'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected (attempt $attempt); retrying after fetching main..."
            sleep 2
          done
          echo 'Unable to push patched source after 5 attempts.'
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetFTPLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
